name: Windows release
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - name: Build signed-ready Windows artifacts
        shell: powershell
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CLOUD_API_URL: ${{ vars.VITE_CLOUD_API_URL }}
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: qa-ai-windows
          path: |
            frontend/release/*.exe
            frontend/release/*.zip

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath frontend/release -File |
            Where-Object { $_.Extension -in '.exe', '.zip' } |
            Select-Object -ExpandProperty FullName
          if ($assets.Count -ne 2) {
            throw "Expected exactly two release assets, found $($assets.Count)."
          }
          $installer = Get-ChildItem -LiteralPath frontend/release -File -Filter '*.exe' | Select-Object -First 1
          $latestInstaller = Join-Path $installer.DirectoryName 'QA-AI-Platform-latest-x64.exe'
          Copy-Item -LiteralPath $installer.FullName -Destination $latestInstaller
          gh release create "${{ github.ref_name }}" ($assets + $latestInstaller) `
            --title "QA-AI Platform ${{ github.ref_name }}" `
            --generate-notes
